# YOLO11s + P2/4 小目标检测头（自定义，Phase 1 E3）
# 基于 ultralytics/cfg/models/11/yolo11.yaml，只改 head：增加 P2 分支，
# Detect 从 [16,19,22] (P3/P4/P5) 改为 [19,22,25,28] (P2/P3/P4/P5)。
# backbone 0-10 与官方 yolo11s 完全一致，便于迁移预训练权重。

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]      # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]      # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]     # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]        # 9
  - [-1, 2, C2PSA, [1024]]          # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]       # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]]     # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]       # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]]     # 16 (P3/8)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]       # 18 cat backbone P2
  - [-1, 2, C3k2, [128, False]]     # 19 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]      # 21 cat head P3
  - [-1, 2, C3k2, [256, False]]     # 22 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]      # 24 cat head P4
  - [-1, 2, C3k2, [512, False]]     # 25 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]      # 27 cat head P5
  - [-1, 2, C3k2, [1024, True]]     # 28 (P5/32-large)

  - [[19, 22, 25, 28], 1, Detect, [nc]]  # Detect(P2, P3, P4, P5)
