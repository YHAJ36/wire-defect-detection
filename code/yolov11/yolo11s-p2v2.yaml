# YOLO11s + P2/4 小目标检测头（v2，追加式）
#
# 与 yolo11s-p2.yaml（v1）的唯一区别：P2 支路的位置。
#   v1：把 P2 支路插在第 16 层之后，导致原 17-22 层整体后移 6 位，
#       检测头从第 23 层挪到第 29 层。ultralytics 按「层号+分支号」对齐权重，
#       错位后第 23-28 层与检测头全部对不上，直接 load 只有 297/593 能迁移，
#       检测头 161 个张量迁移率为 0 —— 等于每颗种子重学一个检测头。
#   v2：0-22 层与官方 yolo11.yaml 逐层一致，P2 支路追加在 23-25 层，
#       检测头在 26 层。这样 0-22 层权重可以 100% 继承，检测头按分支号平移
#       3 位即可全部继承，只有新增的 P2 支路（23/25 层）与 P2 检测分支是随机的。
#
# 对照组关系：除「多一条 P2 支路 + 检测头多一个输出尺度」外，其余全部与封版
# 896 基线一致，这样 P2 才是唯一变量。

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]      # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]      # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]     # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]        # 9
  - [-1, 2, C2PSA, [1024]]          # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]       # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]]     # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]       # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]]     # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]      # 17
  - [[-1, 13], 1, Concat, [1]]      # 18 cat head P4
  - [-1, 2, C3k2, [512, False]]     # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]      # 20
  - [[-1, 10], 1, Concat, [1]]      # 21 cat head P5
  - [-1, 2, C3k2, [1024, True]]     # 22 (P5/32-large)

  # ---- 以下三层为新增的 P2 支路，官方配置里没有对应层 ----
  # 注意这里用 [256, ...] 而不是官方 p2 配置常见的 [128, ...]：
  #   Detect 的分类分支内部宽度 c3 = max(最小尺度输入通道, min(nc,100))，
  #   若 P2 支路输出 64 通道（s 尺度下 128*0.5），c3 会从 128 掉到 64，
  #   于是预训练分类头的每一层都因宽度不一致而全部丢弃（实测 73 个张量归零）。
  #   用 256（s 尺度下 128 通道，与 P3 相同）可让 c3 保持 128，
  #   分类头 4 个分支全部可继承，只有类别卷积（nc 80->3）需要重学。
  - [16, 1, nn.Upsample, [None, 2, "nearest"]]   # 23 P3 上采样到 P2/4
  - [[-1, 2], 1, Concat, [1]]       # 24 cat backbone P2/4
  - [-1, 2, C3k2, [256, False]]     # 25 (P2/4，宽度与 P3 对齐)

  - [[25, 16, 19, 22], 1, Detect, [nc]]  # 26 Detect(P2, P3, P4, P5)
